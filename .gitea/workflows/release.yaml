name: Build gradle jar

on:
  push:
    tags:
      - v*
      - release

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    container:
      image: registry.nvaria.cloud/ubuntu-act-jdk21:latest
      credentials:
        username: ${{ vars.DOCKERUSER }}
        password: ${{ vars.DOCKERPW }}
    env:
      RUNNER_TOOL_CACHE: /toolcache
      NEXUS_MVN_RELEASE: ${{ vars.NEXUS_MVN_RELEASE  }}
      NEXUS_MVN_SNAPSHOTS: ${{ vars.NEXUS_MVN_SNAPSHOTS }}
      NEXUS_USER: ${{ vars.DOCKERUSER }}
      NEXUS_PW: ${{ vars.DOCKERPW }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ vars.PAT}}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build with Gradle
        run: gradle build --no-daemon
      - name: Generate SBOM
        run: gradle spdxSbomForRelease --no-daemon
      - name: Publish to nexus
        run: gradle publishMavenPublicationToMaven-releaseRepository --no-daemon






