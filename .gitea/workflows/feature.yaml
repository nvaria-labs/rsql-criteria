name: Build gradle jar
on:
  push:
    branches:
      - "feature/*"

jobs:
  build:

    name: Build image
    runs-on: ubuntu-latest
    container:
      image: registry.nvaria.cloud/catthehacker/ubuntu:act-latest
      credentials:
        username: ${{ vars.DOCKERUSER }}
        password: ${{ vars.DOCKERPW }}
    env:
      RUNNER_TOOL_CACHE: /toolcache
      NEXUS_MVN_RELEASE: ${{ vars.NEXUS_MVN_RELEASE  }}
      NEXUS_MVN_SNAPSHOTS: ${{ vars.NEXUS_MVN_SNAPSHOTS }}
      NEXUS_USER: ${{ vars.DOCKERUSER }}
      NEXUS_PW: ${{ vars.DOCKERPW }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          id: 'java'
          cache: 'gradle'
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      - name: Publish to nexus
        run: ./gradlew publishMavenPublicationToMaven-snapshotsRepository --no-daemon






