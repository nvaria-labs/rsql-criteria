[versions]

junit5 = "6.1.0-M1"
junit5launcher="6.1.0-M1"
mockito ="5.23.0"
instancio ="5.1.0"
antlr = "4.13.2"
hamcrest ="3.0"
hamcrestdate="2.0.8"
jakarta-persistence = "3.2.0"
hibernate-core = "7.3.0.Final"
h2 = "2.4.240"


[libraries]

junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit5launcher" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

instancio-core = { module = "org.instancio:instancio-core", version.ref = "instancio" }
instancio-junit = { module = "org.instancio:instancio-junit", version.ref = "instancio" }

antlr-v4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
antlr-v4 = { module = "org.antlr:antlr4", version.ref = "antlr" }

hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
hamcrest-date = { module = "org.exparity:hamcrest-date", version.ref = "hamcrestdate" }

jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate-core" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }