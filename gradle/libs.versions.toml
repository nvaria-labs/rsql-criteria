[versions]

junit = "6.1.3"
junitlauncher="6.1.3"
antlr = "4.13.2"
hamcrest ="3.0"
jakarta-persistence = "3.2.0"
hibernate-core = "7.4.15.Final"
h2 = "2.5.252"

ben-manes-versions = "0.67.0"
jacocolog = "4.0.3"
release = "1.5.1"
spdx-sbom = "0.12.0"
licenser = "4.0.0"
vanniktech-publish = "0.37.0"

[plugins]

ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }
jacocolog = { id = "org.barfuin.gradle.jacocolog", version.ref = "jacocolog" }
release = { id = "io.github.simonhauck.release", version.ref = "release" }
spdx-sbom = { id = "org.spdx.sbom", version.ref = "spdx-sbom" }
licenser = { id = "dev.yumi.gradle.licenser", version.ref = "licenser" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }

[libraries]

junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitlauncher" }

antlr-v4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
antlr-v4 = { module = "org.antlr:antlr4", version.ref = "antlr" }

hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate-core" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }